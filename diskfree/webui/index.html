<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiskFree — space with confidence</title>
<meta name="description" content="Safe, efficient disk cleaning with local AI advice. Read-only scans, reversible removals, nothing leaves your machine.">
<meta name="author" content="codero-sus">
<meta name="theme-color" content="#07110f">
<meta property="og:title" content="DiskFree — space with confidence">
<meta property="og:description" content="A safe, local-first disk manager. Your data stays yours.">
<meta property="og:url" content="https://the-codero.web.app/">
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<div id="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
          <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.4" opacity=".35"/>
          <path d="M16 3a13 13 0 0 1 11.3 19.4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M11 16.5l3.4 3.4L22 12" fill="none" stroke="currentColor" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong>DiskFree</strong>
        <small id="brand-version">local · safe</small>
      </span>
    </div>

    <nav class="nav" id="nav" aria-label="Main">
      <button class="nav-item is-active" data-view="overview"><span class="ico">◐</span>Overview</button>
      <button class="nav-item" data-view="scan"><span class="ico">🔎</span>Scan</button>
      <button class="nav-item" data-view="findings"><span class="ico">🧾</span>Findings<span class="badge" id="badge-findings" hidden>0</span></button>
      <button class="nav-item" data-view="advisor"><span class="ico">✦</span>AI Advisor</button>
      <button class="nav-item" data-view="clean"><span class="ico">🧹</span>Clean</button>
      <button class="nav-item" data-view="history"><span class="ico">↩</span>History</button>
      <button class="nav-item" data-view="assistant"><span class="ico">💬</span>Cleanup Chat</button>
      <div class="nav-sep"></div>
      <button class="nav-item" data-view="rules"><span class="ico">📐</span>Rules</button>
      <button class="nav-item" data-view="safety"><span class="ico">🛡</span>Safety</button>
      <button class="nav-item" data-view="settings"><span class="ico">⚙</span>Settings</button>
    </nav>

    <div class="sidebar-foot">
      <div class="meter" id="sidebar-meter" title="Home volume usage">
        <div class="meter-track"><div class="meter-fill" id="sidebar-meter-fill"></div></div>
        <div class="meter-label"><span id="sidebar-meter-text">checking disk…</span></div>
      </div>
      <div class="provider-strip" id="provider-strip"></div>
      <div class="sidebar-credit">
        <p>Made with <span aria-label="love">❤️</span> by
          <a href="https://github.com/codero-sus" target="_blank" rel="noopener noreferrer">codero-sus</a>
        </p>
        <a class="credit-site" href="https://the-codero.web.app/" target="_blank" rel="noopener noreferrer">
          Visit the website <span aria-hidden="true">↗</span>
        </a>
      </div>
    </div>
  </aside>
  <button class="nav-backdrop" id="nav-backdrop" type="button" aria-label="Close navigation"></button>

  <main class="main" id="main-content" tabindex="-1">
    <header class="topbar">
      <div class="topbar-title">
        <button class="icon-btn menu-toggle" id="btn-menu" type="button" aria-label="Open navigation"
                aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <div>
          <h1 id="view-title">Overview</h1>
          <p id="view-subtitle">Your disk at a glance.</p>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="privacy-stamp"><span class="privacy-dot"></span>LOCAL ONLY</span>
        <span class="pill" id="pill-readonly" hidden title="DiskFree cannot modify anything">read-only</span>
        <span class="pill" id="pill-scan" hidden>scan idle</span>
        <button class="btn btn-ghost" id="btn-quick-scan" title="Scan your home directory">Quick scan</button>
        <label class="model-picker" title="Choose the local model used for chat and AI advice">
          <span class="sr-only">Local AI model</span>
          <select id="model-select" aria-label="Select local AI model">
            <option value="auto|">Auto · best available</option>
            <option value="heuristic|">Rule engine · offline</option>
          </select>
          <span class="model-caret" aria-hidden="true">⌄</span>
        </label>
        <button class="btn btn-ghost" id="btn-open-chat" aria-label="Open cleanup chat"
                title="Tell the AI what to clear and what to keep">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H7l-3 2v-5.1A7.5 7.5 0 1 1 20 11.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg><span>Chat</span>
        </button>
        <button class="btn btn-primary" id="btn-advise" title="Analyse the latest scan">✦ Analyse</button>
      </div>
    </header>

    <div class="toast-stack" id="toasts" role="status" aria-live="polite"></div>

    <section class="view is-active" id="view-overview"></section>
    <section class="view" id="view-scan"></section>
    <section class="view" id="view-findings"></section>
    <section class="view" id="view-advisor"></section>
    <section class="view" id="view-clean"></section>
    <section class="view" id="view-history"></section>
    <section class="view" id="view-assistant"></section>
    <section class="view" id="view-rules"></section>
    <section class="view" id="view-safety"></section>
    <section class="view" id="view-settings"></section>
  </main>
</div>

<dialog id="modal" class="modal">
  <form method="dialog" class="modal-card">
    <header class="modal-head">
      <h2 id="modal-title">Details</h2>
      <button class="icon-btn" value="cancel" aria-label="Close">✕</button>
    </header>
    <div class="modal-body" id="modal-body"></div>
    <footer class="modal-foot" id="modal-foot">
      <button class="btn btn-ghost" value="cancel">Close</button>
    </footer>
  </form>
</dialog>

<template id="tpl-token">
  <div class="token-prompt">
    <p>This DiskFree instance is protected by an access token.</p>
    <input type="password" id="token-input" placeholder="DISKFREE_UI_TOKEN" autocomplete="off">
    <button class="btn btn-primary" id="token-save">Unlock</button>
  </div>
</template>

<script src="/app.js" defer></script>
</body>
</html>
