<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiskFree — AI powered disk manager and cleaner</title>
<meta name="description" content="Safe, efficient disk cleaning with local AI advice. Read-only scans, reversible removals, nothing leaves your machine.">
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<div id="app">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
          <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.4" opacity=".35"/>
          <path d="M16 3a13 13 0 0 1 11.3 19.4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M11 16.5l3.4 3.4L22 12" fill="none" stroke="currentColor" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong>DiskFree</strong>
        <small id="brand-version">local · safe</small>
      </span>
    </div>

    <nav class="nav" id="nav" aria-label="Main">
      <button class="nav-item is-active" data-view="overview"><span class="ico">◐</span>Overview</button>
      <button class="nav-item" data-view="scan"><span class="ico">🔎</span>Scan</button>
      <button class="nav-item" data-view="findings"><span class="ico">🧾</span>Findings<span class="badge" id="badge-findings" hidden>0</span></button>
      <button class="nav-item" data-view="advisor"><span class="ico">✦</span>AI Advisor</button>
      <button class="nav-item" data-view="clean"><span class="ico">🧹</span>Clean</button>
      <button class="nav-item" data-view="history"><span class="ico">↩</span>History</button>
      <button class="nav-item" data-view="assistant"><span class="ico">💬</span>Assistant</button>
      <div class="nav-sep"></div>
      <button class="nav-item" data-view="rules"><span class="ico">📐</span>Rules</button>
      <button class="nav-item" data-view="safety"><span class="ico">🛡</span>Safety</button>
      <button class="nav-item" data-view="settings"><span class="ico">⚙</span>Settings</button>
    </nav>

    <div class="sidebar-foot">
      <div class="meter" id="sidebar-meter" title="Home volume usage">
        <div class="meter-track"><div class="meter-fill" id="sidebar-meter-fill"></div></div>
        <div class="meter-label"><span id="sidebar-meter-text">checking disk…</span></div>
      </div>
      <div class="provider-strip" id="provider-strip"></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="view-title">Overview</h1>
        <p id="view-subtitle">Your disk at a glance.</p>
      </div>
      <div class="topbar-actions">
        <span class="pill" id="pill-readonly" hidden title="DiskFree cannot modify anything">read-only</span>
        <span class="pill" id="pill-scan" hidden>scan idle</span>
        <button class="btn btn-ghost" id="btn-quick-scan" title="Scan your home directory">Quick scan</button>
        <button class="btn btn-primary" id="btn-advise" title="Analyse the latest scan">✦ Analyse</button>
      </div>
    </header>

    <div class="toast-stack" id="toasts" role="status" aria-live="polite"></div>

    <section class="view is-active" id="view-overview"></section>
    <section class="view" id="view-scan"></section>
    <section class="view" id="view-findings"></section>
    <section class="view" id="view-advisor"></section>
    <section class="view" id="view-clean"></section>
    <section class="view" id="view-history"></section>
    <section class="view" id="view-assistant"></section>
    <section class="view" id="view-rules"></section>
    <section class="view" id="view-safety"></section>
    <section class="view" id="view-settings"></section>
  </main>
</div>

<dialog id="modal" class="modal">
  <form method="dialog" class="modal-card">
    <header class="modal-head">
      <h2 id="modal-title">Details</h2>
      <button class="icon-btn" value="cancel" aria-label="Close">✕</button>
    </header>
    <div class="modal-body" id="modal-body"></div>
    <footer class="modal-foot" id="modal-foot">
      <button class="btn btn-ghost" value="cancel">Close</button>
    </footer>
  </form>
</dialog>

<template id="tpl-token">
  <div class="token-prompt">
    <p>This DiskFree instance is protected by an access token.</p>
    <input type="password" id="token-input" placeholder="DISKFREE_UI_TOKEN" autocomplete="off">
    <button class="btn btn-primary" id="token-save">Unlock</button>
  </div>
</template>

<script src="/app.js" defer></script>
</body>
</html>
